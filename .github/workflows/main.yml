name: Quant Dashboard Auto Update

# 실행 조건 설정
on:
  schedule:
    # 한국 시간(KST) 오후 4시 30분 = UTC 오전 7시 30분
    - cron: '30 7 * * 4,5'  # 매주 목,금요일 오후 4시 30분에 실행
  workflow_dispatch:        # 깃허브 웹사이트에서 수동 실행 버튼 활성화

# 깃허브 액션이 저장소에 파일을 쓸 수 있도록 권한 부여
permissions:
  contents: write

jobs:
  update_data:
    # 깃허브에서 제공하는 가상 서버 사용
    runs-on: ubuntu-latest 

    steps:
      # 1. 저장소의 코드를 가상 서버로 가져오기
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. 파이썬 환경 설정
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 필요한 라이브러리 설치 (fdr, yfinance 등)
      - name: Install Dependencies
        run: |
          pip install finance-datareader yfinance pandas openpyxl

      # 4. 퀀트 분석 스크립트 실행
      # - name: Run Quant Analysis Scripts
      #   run: |
      #     python round_bottom.py
      #     python double_bottom.py
      #     python flat_base_stocks.py

      # 4. 수정
      - name: Run Analysis Scripts in Parallel
        run: |
          python round_bottom.py &
          python double_bottom.py &
          python flat_base_stocks.py &
          wait  

      # 5. 생성된 JSON 결과 파일들을 저장소에 커밋 및 푸시
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 변경된 JSON 파일이 있는지 확인 후 커밋
          git add *.json
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "📊 데이터 자동 업데이트: $(date +'%Y-%m-%d %H:%M:%S') (KST)"
            git push
          else
            echo "변경 사항이 없어 푸시를 생략합니다."
          fi