name: Quant Dashboard Auto Update

# main.yml 파일에 추가하면 좋은 권한 설정
permissions:
  contents: write

# 실행 조건 설정
on:
  schedule:
    - cron: '30 15 * * 1-5' # 월~금 한국 시간 오후 4시 30분 실행 (장 마감 후)
  workflow_dispatch:      # 깃허브 웹사이트에서 버튼 눌러 수동 실행 가능

jobs:
  update_data:
    # 사용자님의 구형 노트북(Self-hosted runner)에서 실행
    runs-on: self-hosted 

    steps:
      # 1. 깃허브에 올라간 최신 코드 가져오기
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 2. 퀀트 분석 스크립트 3종 실행
      - name: Run Quant Analysis Scripts
        run: |
          python round_bottom_analysis.py
          python double_bottom_analysis.py
          python flat_base_analysis.py

      # 3. 생성된 .json 결과 파일들을 깃허브에 다시 업로드
      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add *.json
          # 변경사항이 있을 때만 커밋 (에러 방지)
          git commit -m "📊 데이터 자동 업데이트: $(date +'%Y-%m-%d')" || echo "변경 사항 없음"
          git push